<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
  <title>Lista de Usuarios</title>
         <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }

            #cards {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .card {
                border: 1px solid #999;
                padding: 15px;
                width: 250px;
                cursor: pointer;
            }

            .card h2 {
                font-size: 18px;
            }
        </style>
    </head>
    <body>

    <h1>Lista de Usuarios</h1>

    <div id="cards"></div>
    <p id="total"></p>

    <script src="cards.js"></script>
    </body>
</html>
